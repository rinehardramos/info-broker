services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d info_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    mem_limit: 1g
    mem_reservation: 256m
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Redis — cache layer for tool results and embeddings.
  # Volatile but persisted (AOF every-second) so a restart doesn't blow the
  # embedding cache. ~30-40% LLM cost reduction at steady state expected.
  redis:
    image: redis:7-alpine
    mem_limit: 512m
    mem_reservation: 128m
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 384mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickHouse — durable telemetry store (mon.requests + rollup MVs).
  # Single-node; ~300–500 MB idle on the home-server box.
  # Additive-only schema changes (platform-monitoring bootstrap is idempotent).
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    mem_limit: 1g
    mem_reservation: 256m
    ports:
      - "8123:8123"   # HTTP interface (used by clickhouse-connect)
      - "9000:9000"   # native TCP (optional, useful for clickhouse-client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Monitoring Redis — dedicated instance with noeviction policy.
  # MUST NOT share the app's allkeys-lru cache Redis: LRU eviction would
  # silently drop denylist entries and counters (spec §6.2 rationale).
  # appendonly yes: stream data survives container restart.
  # ~50–150 MB on the home-server box.
  # ---------------------------------------------------------------------------
  monitoring-redis:
    image: redis:7-alpine
    mem_limit: 512m
    mem_reservation: 64m
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6380:6379"   # mapped to 6380 on the host to avoid conflict with app redis (6379)
    volumes:
      - monitoring_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Monitoring worker — drains the Redis stream into ClickHouse.
  # Runs as a separate container so ingestion never competes with request handling.
  # ~80–120 MB on the home-server box.
  # ---------------------------------------------------------------------------
  monitoring-worker:
    build: .
    command: python -m platform_monitoring.worker
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://default:@clickhouse:8123}
      MONITORING_REDIS_URL: ${MONITORING_REDIS_URL:-redis://monitoring-redis:6379/0}
      GEOLITE2_DB_PATH: ${GEOLITE2_DB_PATH:-/opt/geolite2/GeoLite2-City.mmdb}
      MON_RAW_RETENTION_DAYS: ${MON_RAW_RETENTION_DAYS:-30}
      MON_STREAM_MAXLEN: ${MON_STREAM_MAXLEN:-1000000}
      MON_ENFORCEMENT_FAIL_MODE: ${MON_ENFORCEMENT_FAIL_MODE:-open}
      MON_ALERT_WEBHOOK_URL: ${MON_ALERT_WEBHOOK_URL:-}
      MON_ALERT_WEBHOOK_SECRET: ${MON_ALERT_WEBHOOK_SECRET:-}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      MON_USAGE_STREAM_MAXLEN: ${MON_USAGE_STREAM_MAXLEN:-100000}
    volumes:
      - ${GEOLITE2_HOST_PATH:-/opt/geolite2}:/opt/geolite2:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      monitoring-redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    mem_limit: 1g
    mem_reservation: 256m
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://info-broker-api:8000
      VITE_WS_URL: ws://localhost:8000/v3/stream
    depends_on:
      info-broker-api:
        condition: service_healthy

  info-broker-api:
    build: .
    # 2g: each Claude Code subprocess is ~280-300 MB resident, and the brain
    # fan-out can spawn up to MAX_PARALLEL_TACTICIANS (default 3) concurrently
    # via the bounded gather. 3 × 300 MB + uvicorn (~150 MB) + brain hold state
    # peaked at 86% of 1 GiB during a 10-hypothesis disconfirm phase — one
    # bad subprocess away from OOM (exit 137, all in-flight runs orphaned).
    # 2 GiB gives the same fan-out comfortable headroom (~50% steady-state).
    mem_limit: 2g
    mem_reservation: 384m
    environment:
      INFO_BROKER_API_KEY: ${INFO_BROKER_API_KEY:-changeme}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN: ${CLAUDE_CODE_OAUTH_REFRESH_TOKEN:-}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_DEV_APP_CLIENT_ID:-${GITHUB_CLIENT_ID:-}}
      GITHUB_CLIENT_SECRET: ${GITHUB_DEV_APP_CLIENT_SECRET:-${GITHUB_CLIENT_SECRET:-}}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      FRONTEND_OAUTH_CALLBACK: ${FRONTEND_OAUTH_CALLBACK:-http://localhost:5173/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
      TEMPORAL_PORT: ${TEMPORAL_PORT:-7233}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      IS_MCP_CONFIG: /app/config/is-mcp-config.docker.json
      MCP_SIGNING_SECRET: ${MCP_SIGNING_SECRET:-}
      HOME: /root
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://default:@clickhouse:8123}
      MONITORING_REDIS_URL: ${MONITORING_REDIS_URL:-redis://monitoring-redis:6379/0}
      GEOLITE2_DB_PATH: ${GEOLITE2_DB_PATH:-/opt/geolite2/GeoLite2-City.mmdb}
      MON_RAW_RETENTION_DAYS: ${MON_RAW_RETENTION_DAYS:-30}
      MON_TRUSTED_PROXIES: ${MON_TRUSTED_PROXIES:-}
      MON_ENFORCEMENT_FAIL_MODE: ${MON_ENFORCEMENT_FAIL_MODE:-open}
      MON_STREAM_MAXLEN: ${MON_STREAM_MAXLEN:-1000000}
      MON_ALERT_WEBHOOK_URL: ${MON_ALERT_WEBHOOK_URL:-}
      MON_ALERT_WEBHOOK_SECRET: ${MON_ALERT_WEBHOOK_SECRET:-}
      MON_USAGE_STREAM_MAXLEN: ${MON_USAGE_STREAM_MAXLEN:-100000}
      MON_USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      # Path B: orchestrated IS-brain loop is now the DEFAULT path. Set
      # IS_USE_LOOP=false to fall back to the legacy single-shot brain only
      # if explicitly needed (cheap one-off queries, debugging, etc.).
      IS_USE_TEMPORAL: ${IS_USE_TEMPORAL:-true}
      IS_USE_LOOP: ${IS_USE_LOOP:-true}
      IS_LOOP_MAX_TURNS: ${IS_LOOP_MAX_TURNS:-8}
    volumes:
      # /root/.claude — Claude CLI credentials + sessions + projects + backups.
      # Prefer a bind-mount of the host's ~/.claude so the OAuth token's
      # refresh (done by host `claude` CLI every ~24h) flows through
      # automatically and the container never goes stale. Falls back to the
      # named volume claude_auth in CI/cloud where there's no host dir.
      # Set HOST_CLAUDE_DIR=/home/$USER/.claude in .env to enable bind-mount.
      - ${HOST_CLAUDE_DIR:-claude_auth}:/root/.claude
      # NOTE: also need /root/.claude.json as a SIBLING FILE for the CLI to
      # consider itself "logged in". Docker Desktop on WSL silently turns this
      # bind into an overlay dir, so we populate it via a runtime entrypoint
      # workaround OR via `docker cp` post-startup. See ops runbook.
      # Legacy: macOS / setup-token flow can drop creds at ~/.config/anthropic.
      # On WSL/Linux that path is usually empty (Claude CLI writes ~/.claude/),
      # but kept for compatibility. /dev/null default = effectively no mount.
      - ${CLAUDE_CREDS_DIR:-/dev/null}:/root/.config/anthropic:ro
      - ${GEOLITE2_HOST_PATH:-/opt/geolite2}:/opt/geolite2:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  temporal:
    image: temporalio/auto-setup:1.24
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PWD: password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal UI is optional — only useful for debugging workflows.
  # Enable with: docker compose --profile ui up
  temporal-ui:
    image: temporalio/ui:2.26.2
    profiles: ["ui"]
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # Neo4j is opt-in — required only for the knowledge-graph surface.
  # Enable with: docker compose --profile graph up
  # When absent, app/knowledge/* calls become no-ops at the client layer.
  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    mem_limit: 1500m
    mem_reservation: 768m
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-worker:
    build: .
    command: python -m app.pipeline.worker
    mem_limit: 768m
    mem_reservation: 256m
    environment:
      INFO_BROKER_API_KEY: ${INFO_BROKER_API_KEY:-changeme}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_DEV_APP_CLIENT_ID:-${GITHUB_CLIENT_ID:-}}
      GITHUB_CLIENT_SECRET: ${GITHUB_DEV_APP_CLIENT_SECRET:-${GITHUB_CLIENT_SECRET:-}}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      FRONTEND_OAUTH_CALLBACK: ${FRONTEND_OAUTH_CALLBACK:-http://localhost:5173/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    depends_on:
      - temporal
      - postgres
      - qdrant

  # IS-run Temporal worker — hosts ISRunWorkflow (single-shot) and
  # IsLoopRunWorkflow (Path B). Listens on the "is-run-tasks" queue.
  # Only consumed when IS_USE_TEMPORAL=true on the API.
  is-temporal-worker:
    build: .
    command: python -m app.temporal.worker
    mem_limit: 3g
    mem_reservation: 1500m
    environment:
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      IS_MCP_CONFIG: /app/config/is-mcp-config.docker.json
      IS_BRAIN_TURN_TIMEOUT: ${IS_BRAIN_TURN_TIMEOUT:-180}
      MCP_SIGNING_SECRET: ${MCP_SIGNING_SECRET:-}
      INFO_BROKER_API_KEY: ${INFO_BROKER_API_KEY:-changeme}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_REFRESH_TOKEN: ${CLAUDE_CODE_OAUTH_REFRESH_TOKEN:-}
      HOME: /root
    volumes:
      # See info-broker-api block above for the HOST_CLAUDE_DIR rationale —
      # the is-temporal-worker spawns brain subprocesses too, so it needs the
      # same auto-refreshing credentials path.
      - ${HOST_CLAUDE_DIR:-claude_auth}:/root/.claude
      - ${CLAUDE_CREDS_DIR:-/dev/null}:/root/.config/anthropic:ro
    depends_on:
      - temporal
      - postgres

  # Cloudflare Tunnel — public ingress without port-forwarding.
  # Enable with: docker compose --profile tunnel up
  # Requires CLOUDFLARED_TOKEN in .env (created in Cloudflare Zero Trust dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      info-broker-api:
        condition: service_healthy

volumes:
  qdrant_data:
  postgres_data:
  claude_auth:
  neo4j_data:
  redis_data:
  clickhouse_data:
  monitoring_redis_data:
