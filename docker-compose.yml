version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d info_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://info-broker-api:8000
      VITE_WS_URL: ws://localhost:8000/v3/stream
    depends_on:
      info-broker-api:
        condition: service_healthy

  info-broker-api:
    build: .
    environment:
      INFO_BROKER_API_KEY: ${INFO_BROKER_API_KEY:-changeme}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Claude Code auth: auto-extracted by scripts/ensure-claude-auth.sh
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
      TEMPORAL_PORT: ${TEMPORAL_PORT:-7233}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      IS_MCP_CONFIG: /app/config/is-mcp-config.docker.json
      HOME: /root
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    volumes:
      - claude_auth:/root/.claude
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PWD: password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-worker:
    build: .
    command: python -m app.pipeline.worker
    environment:
      INFO_BROKER_API_KEY: ${INFO_BROKER_API_KEY:-changeme}
      APIFY_BASE_URL: ${APIFY_BASE_URL:-https://api.apify.com/v2}
      POSTGRES_DB: info_broker
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    depends_on:
      - temporal
      - postgres
      - qdrant

volumes:
  qdrant_data:
  postgres_data:
  claude_auth:
  neo4j_data:
